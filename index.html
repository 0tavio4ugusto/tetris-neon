<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TETRIS NEON</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="particles-bg"></div>
  <div id="app">
    <div id="sidebar-left">
      <div class="panel">
        <h3>HOLD</h3>
        <canvas id="hold" width="120" height="120"></canvas>
        <p class="hint">C</p>
      </div>
      <div class="panel stats">
        <h3>STATS</h3>
        <div class="stat-row"><span>SCORE</span><span id="score">0</span></div>
        <div class="stat-row"><span>LEVEL</span><span id="level">1</span></div>
        <div class="stat-row"><span>LINES</span><span id="lines">0</span></div>
        <div class="stat-row"><span>COMBO</span><span id="combo">0</span></div>
      </div>
    </div>
    <div id="board-container">
      <canvas id="board"></canvas>
      <div id="overlay" class="hidden">
        <h1 id="overlay-title">TETRIS NEON</h1>
        <p id="overlay-sub">Press ENTER to start</p>
      </div>
    </div>
    <div id="sidebar-right">
      <div class="panel">
        <h3>NEXT</h3>
        <canvas id="next" width="120" height="360"></canvas>
      </div>
      <div class="panel controls">
        <h3>CONTROLS</h3>
        <div class="ctrl-row"><kbd>←</kbd><kbd>→</kbd> Move</div>
        <div class="ctrl-row"><kbd>↑</kbd> Rotate</div>
        <div class="ctrl-row"><kbd>↓</kbd> Soft Drop</div>
        <div class="ctrl-row"><kbd>Space</kbd> Hard Drop</div>
        <div class="ctrl-row"><kbd>C</kbd> Hold</div>
        <div class="ctrl-row"><kbd>P</kbd> Pause</div>
      </div>
    </div>
  </div>
  <canvas id="fx"></canvas>
  <script src="tetris.js"></script>
</body>
</html>
